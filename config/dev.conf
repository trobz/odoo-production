[options]
admin_passwd = admin

without_demo = False
verbose = True

# configure the remote debug (require to enable "remote_debug" server wide module)
debug_port = 5678
debug_host = auto
debug_enabled = True

# dev mode: all, [pudb|wdb|ipdb|pdb], reload, qweb, werkzeug, xml
dev_mode = pudb,wdb,ipdb,pdb,qweb,werkzeug,xml

db_user = openerp
db_password = openerp
db_port = 5432
db_host = localhost
db_maxconn = 64
db_template = template1

http_enable = True
http_interface = 0.0.0.0
http_port = 8069

; Load server wide modules, require server-tools repository
server_wide_modules = base,web

; Log settings
; logfile = log/server.log
log_level = debug_rpc
;debug, debug_sql

data_dir = ./var/storage

; False prevents the client displaying the list of databases
list_db = True
translate_modules = ['all']

limit_time_cpu = 3600
limit_time_real = 3600

# we enable multiprocessing mode, as in all of our deployments
workers = 2

# we disable cron workers by default
# to make sure that:
# - unwanted/unexpected scheduled actions don't run
# - amongst them the one that checks subscription status in enterprise projects (to avoid local dbs from expiring)
max_cron_threads = 0

#  we disable the job runner by default
[queue_job]
channels = root:0